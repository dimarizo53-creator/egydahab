<style>
  :root{
    --bg:#FBF7EE; --surface:#FFFFFF; --surface-2:#F4EEDF; --border:#E6DCC6;
    --teal:#0E6E5E; --teal-deep:#0A5346; --gold:#B8860B; --gold-bright:#D89B1F;
    --ink:#20281F; --ink-muted:#8A8070; --up:#1E8E5A; --down:#8B3A3A;
    --font-display:'Tajawal',sans-serif; --font-body:'Cairo',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:radial-gradient(ellipse 900px 500px at 12% -8%, rgba(14,110,94,.07), transparent 60%),
      radial-gradient(ellipse 800px 500px at 100% 10%, rgba(184,134,11,.08), transparent 60%), var(--bg);
    color:var(--ink);font-family:var(--font-body);font-weight:600;min-height:100vh;line-height:1.6;
  }
  .app{max-width:760px;margin:0 auto;padding:0 20px 80px;}
  header{display:flex;justify-content:space-between;align-items:center;padding:30px 0 22px;border-bottom:1px solid var(--border);margin-bottom:40px;flex-wrap:wrap;gap:12px;}
  .logo{display:flex;align-items:center;gap:12px;text-decoration:none;}
  .logo-mark{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--gold-bright),var(--gold) 75%);box-shadow:0 3px 12px rgba(184,134,11,.32);}
  .logo-text{font-family:var(--font-display);font-weight:900;font-size:20px;letter-spacing:.5px;color:#C5A046;}
  .logo-text .sub{display:block;font-family:var(--font-display);font-weight:800;font-size:11.5px;color:#C5A046;letter-spacing:1.2px;text-transform:uppercase;}
  .header-right{display:flex;align-items:center;gap:14px;}
  .lang-toggle{background:var(--surface);border:1px solid var(--border);color:var(--ink);font-family:var(--font-mono);font-size:12px;padding:7px 14px;border-radius:20px;cursor:pointer;letter-spacing:1px;}
  .lang-toggle:hover{border-color:var(--teal);color:var(--teal);}
  .icon-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);cursor:pointer;}
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;}
  .icon-btn:hover{border-color:var(--teal);color:var(--teal);}
  .contact-btn{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--teal);text-decoration:none;font-family:var(--font-body);font-weight:700;font-size:12.5px;}
  .contact-btn svg{width:15px;height:15px;stroke:currentColor;flex-shrink:0;}
  .contact-btn:hover{border-color:var(--teal);}
  .menu-wrap{position:relative;}
  .menu-dropdown{display:none;position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:190px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(32,40,31,.14);overflow:hidden;z-index:20;}
  .menu-dropdown.open{display:block;}
  .menu-dropdown a{display:block;padding:12px 16px;font-family:var(--font-body);font-weight:700;font-size:13px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--border);}
  .menu-dropdown a:last-child{border-bottom:none;}
  .menu-dropdown a:hover{background:var(--surface-2);color:var(--teal);}
  .footer-nav{display:flex;justify-content:center;gap:18px;margin-bottom:16px;flex-wrap:wrap;}
  .footer-nav a{font-family:var(--font-body);font-weight:700;font-size:12.5px;color:var(--teal);text-decoration:none;}
  .footer-nav a:hover{text-decoration:underline;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-body);font-weight:700;font-size:13px;color:var(--teal);text-decoration:none;margin-bottom:24px;}
  .back-link:hover{text-decoration:underline;}

  .article-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .article-tag{font-family:var(--font-body);font-weight:800;font-size:11px;letter-spacing:.3px;padding:3px 10px;border-radius:20px;background:var(--surface-2);color:var(--gold);border:1px solid var(--border);}
  .article-tag.usd{color:var(--teal);}
  h1.article-title{font-family:var(--font-display);font-weight:900;font-size:27px;line-height:1.4;color:var(--ink);margin-bottom:14px;}
  .article-excerpt{font-family:var(--font-body);font-weight:600;font-size:15px;color:var(--ink-muted);line-height:1.8;margin-bottom:30px;padding-bottom:26px;border-bottom:1px solid var(--border);}
  .article-body{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:0 6px 24px rgba(32,40,31,.06);margin-bottom:30px;}
  .article-body p{font-family:var(--font-body);font-weight:600;font-size:15px;color:var(--ink);line-height:2;margin-bottom:16px;}
  .article-body p:last-child{margin-bottom:0;}
  .article-body strong{color:var(--teal-deep);}

  .not-found{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:40px 24px;text-align:center;}
  .not-found p{font-family:var(--font-body);font-weight:600;font-size:15px;color:var(--ink-muted);margin-bottom:18px;}
  .not-found a{color:var(--teal);font-weight:800;text-decoration:none;}
  .not-found a:hover{text-decoration:underline;}

  footer{text-align:center;padding-top:24px;margin-top:48px;border-top:1px solid var(--border);}
  .copyright-line{font-family:var(--font-body);font-weight:600;font-size:11.5px;color:var(--ink-muted);}
  @media(max-width:520px){ h1.article-title{font-size:21px;} .article-body{padding:20px;} }
</style>

<script src="articles-data.js"></script>
<script>
const dict = {
  ar: {
    brand: 'إيجي دهب<span class="sub">Egydahab</span>',
    contactLabel: 'تواصل معنا',
    menuHome: 'الرئيسية', menuAbout: 'من نحن', menuArticles: 'المقالات', menuOtherCurrencies: 'عملات أخرى', menuContact: 'تواصل معنا',
    menuPrivacy: 'سياسة الخصوصية', menuTerms: 'الشروط والأحكام', menuDisclaimer: 'إخلاء المسؤولية',
    back: '→ الرجوع لكل المقالات',
    tagGold: 'ذهب', tagUsd: 'دولار',
    notFoundTitle: 'المقال غير موجود',
    notFoundMsg: 'المقال الذي تبحث عنه غير موجود أو تم حذفه.',
    notFoundLink: 'تصفح كل المقالات',
    copyright: '© 2026 إيجي دهب. جميع الحقوق محفوظة.'
  },
  en: {
    brand: 'Egydahab<span class="sub">إيجي دهب</span>',
    contactLabel: 'Contact',
    menuHome: 'Home', menuAbout: 'About Us', menuArticles: 'Articles', menuOtherCurrencies: 'Other Currencies', menuContact: 'Contact',
    menuPrivacy: 'Privacy Policy', menuTerms: 'Terms & Conditions', menuDisclaimer: 'Disclaimer',
    back: '← Back to all articles',
    tagGold: 'Gold', tagUsd: 'Dollar',
    notFoundTitle: 'Article Not Found',
    notFoundMsg: "The article you're looking for doesn't exist or was removed.",
    notFoundLink: 'Browse all articles',
    copyright: '© 2026 Egydahab. All rights reserved.'
  }
};
let lang = 'ar';

function getArticleId(){
  const params = new URLSearchParams(window.location.search);
  return params.get('id');
}

function stripHtml(html){
  return html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
}

function renderArticle(){
  const t = dict[lang];
  const id = getArticleId();
  const list = (typeof ARTICLES !== 'undefined') ? ARTICLES : [];
  const article = list.find(a => a.id === id);
  const container = document.getElementById('articleContent');

  if(!article){
    container.innerHTML = `
      <div class="not-found">
        <p>${t.notFoundMsg}</p>
        <a href="articles.html">${t.notFoundLink}</a>
      </div>`;
    document.title = `${t.notFoundTitle} | Egydahab`;
    document.getElementById('pageTitle').textContent = `${t.notFoundTitle} | Egydahab`;
    return;
  }

  const tagsHtml = article.tags.map(tag => `<span class="article-tag ${tag}">${tag==='gold'?t.tagGold:t.tagUsd}</span>`).join('');
  container.innerHTML = `
    <div class="article-tags">${tagsHtml}</div>
    <h1 class="article-title">${article.title[lang]}</h1>
    <div class="article-excerpt">${article.excerpt[lang]}</div>
    <div class="article-body">${article.body[lang]}</div>
  `;

  const fullTitle = `${article.title[lang]} | Egydahab`;
  const description = article.excerpt[lang];
  const url = `https://egydahab.vercel.app/article.html?id=${article.id}`;

  document.title = fullTitle;
  document.getElementById('pageTitle').textContent = fullTitle;
  document.getElementById('pageDescription').setAttribute('content', description);
  document.getElementById('ogTitle').setAttribute('content', fullTitle);
  document.getElementById('ogDescription').setAttribute('content', description);
  document.getElementById('ogUrl').setAttribute('content', url);
  document.getElementById('canonicalLink').setAttribute('href', url);

  let ld = document.getElementById('articleLd');
  if(!ld){
    ld = document.createElement('script');
    ld.type = 'application/ld+json';
    ld.id = 'articleLd';
    document.head.appendChild(ld);
  }
  ld.textContent = JSON.stringify({
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": article.title[lang],
    "description": description,
    "inLanguage": lang === 'ar' ? 'ar' : 'en',
    "publisher": { "@type": "Organization", "name": "Egydahab" },
    "mainEntityOfPage": url
  });
}

function applyLang(){
  const t = dict[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.innerHTML = t[el.getAttribute('data-i18n')];
  });
  document.getElementById('langBtn').textContent = lang === 'ar' ? 'EN' : 'AR';
  renderArticle();
}
document.getElementById('langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; applyLang(); };
document.getElementById('menuBtn').onclick = (e) => { e.stopPropagation(); document.getElementById('menuDropdown').classList.toggle('open'); };
document.addEventListener('click', (e) => {
  const dropdown = document.getElementById('menuDropdown');
  const btn = document.getElementById('menuBtn');
  if(dropdown.classList.contains('open') && !dropdown.contains(e.target) && e.target !== btn){ dropdown.classList.remove('open'); }
});

applyLang();
</script>
